name: CI - Session7 Deployment

on:
  pull_request:
    branches: [main, homework, day3]
    paths:
      - "app/session7-deployment/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, homework, day3]
    paths:
      - "app/session7-deployment/**"
      - ".github/workflows/ci.yml"

jobs:
  backend-build-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/session7-deployment/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: app/session7-deployment/backend/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build -v -o main ./cmd/server

      - name: Run tests
        run: go test -v ./...

      - name: Coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Upload coverage (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./app/session7-deployment/backend/coverage.out
          flags: backend
        continue-on-error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/session7-deployment/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: app/session7-deployment/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/session7-deployment/backend
          file: ./app/session7-deployment/backend/Dockerfile
          push: false
          tags: mini-asm-backend:test

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./app/session7-deployment/frontend
          file: ./app/session7-deployment/frontend/Dockerfile
          push: false
          tags: mini-asm-frontend:test

  integration-test:
    name: Integration Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [docker-build]
    defaults:
      run:
        working-directory: app/session7-deployment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          timeout 90 bash -c 'until curl -fsS http://localhost:8080/health; do sleep 2; done'

      - name: API smoke test - list assets
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/assets)
          test "$code" = "200"

      - name: API smoke test - create asset
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/assets \
            -H "Content-Type: application/json" \
            -d '{"name":"test.com","type":"domain","status":"active"}')
          test "$code" = "201"

      - name: Frontend health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          test "$code" = "200"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  gosec-scan:
    name: Security - Gosec
    runs-on: ubuntu-latest
    needs: [backend-build-test]
    defaults:
      run:
        working-directory: app/session7-deployment/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...
        continue-on-error: true

  trivy-scan:
    name: Security - Trivy FS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: app/session7-deployment
          severity: CRITICAL,HIGH
          exit-code: "0"

  gitleaks-scan:
    name: Security - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  trufflehog-scan:
    name: Security - TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified
        continue-on-error: true

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-build-test
      - frontend-build
      - docker-build
      - integration-test
      - gosec-scan
      - trivy-scan
      - gitleaks-scan
      - trufflehog-scan

    steps:
      - name: Summary
        run: |
          echo "# CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend Build & Test: ${{ needs.backend-build-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend Build: ${{ needs.frontend-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Build: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Test: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gosec: ${{ needs.gosec-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy: ${{ needs.trivy-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gitleaks: ${{ needs.gitleaks-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- TruffleHog: ${{ needs.trufflehog-scan.result }}" >> $GITHUB_STEP_SUMMARY
